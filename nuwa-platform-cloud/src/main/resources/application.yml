spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    sentinel:
      transport:
        port: 8719
        # sentinel dashboard 地址（容器内通过 docker DNS 解析，主机/本地可被 env SENTINEL_DASHBOARD 覆盖）
        dashboard: 127.0.0.1:8858
      eager: true
  redis:
    database: 1
    port: 6379
    host: 127.0.0.1
    password: 810905
#Ribbon配置
ribbon:
  #请求连接的超时时间
  ConnectTimeout: 5000
  #请求处理/响应的超时时间
  ReadTimeout: 5000
  #对所有操作请求都进行重试，如果没有实现幂等的情况下是很危险的,所以这里设置为false
  OkToRetryOnAllOperations: false
  #切换实例的重试次数
  MaxAutoRetriesNextServer: 5
  #当前实例的重试次数
  MaxAutoRetries: 5
  #负载均衡策略
  #NFLoadBalancerRuleClassName: com.alibaba.cloud.nacos.ribbon.NacosRule

#Sentinel端点配置
management:
  endpoints:
    web:
      exposure:
        include: '*'